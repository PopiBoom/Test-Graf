<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memento Mori — KAPUSTKA</title>
<style>
@font-face{font-family:"Oswald";font-weight:200 700;src:url(assets/Oswald-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Oswald";font-weight:200 700;src:url(assets/Oswald-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Inter Tight";font-weight:100 900;src:url(assets/InterTight-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter Tight";font-weight:100 900;src:url(assets/InterTight-cyrillic.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Inter Tight",system-ui,sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#c{width:min(100vw,177.78vh);aspect-ratio:16/9;display:block;background:#060405}
body.render #c{width:1920px;height:1080px}
body.render #ui,body.render #start{display:none}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);cursor:pointer;z-index:2}
#start button{font:700 20px "Inter Tight",sans-serif;letter-spacing:.12em;color:#fff;background:#e0101e;border:0;border-radius:999px;padding:18px 34px;cursor:pointer;box-shadow:0 0 40px rgba(255,30,40,.6)}
#ui{position:fixed;left:16px;right:16px;bottom:14px;display:flex;gap:12px;align-items:center;opacity:.25;transition:opacity .2s;z-index:1}
#ui:hover{opacity:1}
#ui button{font:600 14px "Inter Tight",sans-serif;color:#fff;background:#222;border:1px solid #444;border-radius:8px;padding:6px 12px;cursor:pointer}
#ui input{flex:1;accent-color:#e0101e}
#ui span{font:500 13px "JetBrains Mono",monospace;min-width:56px;text-align:right}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="start"><button type="button">▶ СМОТРЕТЬ СО ЗВУКОМ</button></div>
<div id="ui"><button id="pp" type="button">▶</button><input id="scrub" type="range" min="0" max="20" step="0.001" value="0"><span id="tc">0.00</span></div>
<audio id="music" src="assets/soundtrack.wav" preload="auto"></audio>
<video id="vid" muted loop playsinline preload="auto" style="display:none"><source src="assets/kapustka.mp4" type="video/mp4"><source src="assets/kapustka.webm" type="video/webm"></video>
<script src="motion.js"></script>
</body>
</html>
